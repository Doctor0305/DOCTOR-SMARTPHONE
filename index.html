<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>DoctorSmartphone</title><style>body{font:16px Arial;background:#f3f6f4;margin:0;color:#173325}header{background:#123b2a;color:white;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;padding:16px;margin:12px 0;border-radius:12px}input,button,select{font:inherit;padding:10px;margin:4px;border-radius:7px;border:1px solid #ccd5cf}button{background:#17633f;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #ddd}.note{background:#e7eee9;padding:10px;border-radius:8px}</style></head><body><header><h1>DoctorSmartphone</h1>Prototipe kasir offline — demo</header><main><div class="card note" id="net"></div><div class="card"><h2>Masuk demo</h2><div class="grid"><label>Peran<br><select id="role"><option>Kasir</option><option>Super Admin</option></select></label><label>Nama pengguna<br><input id="username" placeholder="kasir1"></label><label>PIN demo<br><input id="pin" type="password"></label></div><button onclick="login()">Masuk demo</button><span id="msg"></span></div><section id="app" hidden><div class="card"><h2>Tambah barang</h2><div class="grid"><label>Kode/barcode<br><input id="code"></label><label>Nama barang<br><input id="name"></label><label>Modal<br><input id="cost" type="number" value="0"></label><label>Harga jual<br><input id="price" type="number" value="0"></label><label>Stok<br><input id="stock" type="number" value="0"></label></div><button onclick="addProduct()">Simpan barang</button></div><div class="card"><h2>Daftar barang</h2><div id="products"></div></div><div class="card"><h2>Transaksi demo</h2><label>Kode barang <input id="saleCode"></label><label>Jumlah <input id="qty" type="number" value="1" min="1"></label><button onclick="sell()">Catat penjualan</button><div id="sales"></div></div><div class="card"><button onclick="backup()">Ekspor cadangan JSON</button> <button onclick="logout()">Keluar</button></div></section><p>Catatan: login hanya simulasi lokal. Belum terhubung ke Supabase dan belum sinkron antarperangkat. Jangan gunakan untuk transaksi sungguhan.</p></main><script>const PK='ds_products_demo',SK='ds_sales_demo';let ps=JSON.parse(localStorage.getItem(PK)||'[]'),ss=JSON.parse(localStorage.getItem(SK)||'[]');function status(){document.getElementById('net').textContent=navigator.onLine?'Online — cloud belum terhubung':'Offline — data hanya di perangkat ini'}addEventListener('online',status);addEventListener('offline',status);status();function login(){if(!username.value||!pin.value){msg.textContent=' Isi nama dan PIN demo.';return}app.hidden=false;msg.textContent=' Mode demo: '+role.value;draw()}function logout(){app.hidden=true}function save(){localStorage.setItem(PK,JSON.stringify(ps));localStorage.setItem(SK,JSON.stringify(ss));draw()}function addProduct(){let p={code:code.value.trim(),name:name.value.trim(),cost:+cost.value,price:+price.value,stock:+stock.value};if(!p.code||!p.name){alert('Isi kode dan nama barang');return}let i=ps.findIndex(x=>x.code===p.code);if(i<0)ps.push(p);else ps[i]=p;save()}function sell(){let p=ps.find(x=>x.code===saleCode.value.trim()),q=+qty.value;if(!p||q<1||p.stock<q){alert('Barang tidak ditemukan atau stok kurang');return}p.stock-=q;ss.unshift({time:new Date().toLocaleString('id-ID'),name:p.name,qty:q,total:p.price*q,profit:(p.price-p.cost)*q});save()}function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function draw(){products.innerHTML=ps.length?'<table><tr><th>Kode</th><th>Barang</th><th>Harga</th><th>Stok</th></tr>'+ps.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>Rp ${p.price.toLocaleString('id-ID')}</td><td>${p.stock}</td></tr>`).join('')+'</table>':'Belum ada barang';sales.innerHTML=ss.length?'<table><tr><th>Waktu</th><th>Barang</th><th>Qty</th><th>Total</th><th>Laba demo</th></tr>'+ss.map(s=>`<tr><td>${esc(s.time)}</td><td>${esc(s.name)}</td><td>${s.qty}</td><td>Rp ${s.total.toLocaleString('id-ID')}</td><td>Rp ${s.profit.toLocaleString('id-ID')}</td></tr>`).join('')+'</table>':'Belum ada transaksi'}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({products:ps,sales:ss},null,2)],{type:'application/json'}));a.href=u;a.download='doctor-smartphone-backup.json';a.click();URL.revokeObjectURL(u)}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
